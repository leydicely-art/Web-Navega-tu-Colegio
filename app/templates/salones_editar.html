{% extends "base.html" %}

{% block title %}Editar salón · Portal Escolar{% endblock %}

{% block content %}
<section class="app-card anim-fade-up" style="max-width: 620px; width: 100%; margin: 0 auto;">
    <div class="page-header">
        <div>
            <span class="page-header__eyebrow">Editar</span>
            <h1>Editar salón</h1>
        </div>

        <div class="breadcrumbs">
            <a href="{{ url_for('salones.salones_page') }}">← Salones</a>
        </div>
    </div>

    {% if error %}
    <div class="alert alert-danger" role="alert">{{ error }}</div>
    {% endif %}

    <form method="post" class="d-flex flex-column gap-3">

        <div>
            <label class="form-label" for="nombre">Nombre</label>
            <input
                type="text"
                id="nombre"
                name="nombre"
                class="form-control"
                value="{{ salon.nombre }}"
                required
            >
        </div>

        <div>
            <label class="form-label" for="descripcion">Descripción</label>
            <input
                type="text"
                id="descripcion"
                name="descripcion"
                class="form-control"
                value="{{ salon.descripcion or '' }}"
            >
        </div>

        <div class="d-flex gap-2 mt-2">
            <button type="submit" class="btn btn-primary">
                💾 Guardar
            </button>

            <a href="{{ url_for('salones.salones_page') }}" class="btn btn-secondary">
                Cancelar
            </a>
        </div>

    </form>
</section>
{% endblock %}
