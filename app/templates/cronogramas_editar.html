{% extends "base.html" %}

{% block title %}Editar cronograma · Portal Escolar{% endblock %}

{% block content %}
<section class="app-card anim-fade-up" style="max-width: 680px; width: 100%; margin: 0 auto;">
    <div class="page-header">
        <div>
            <span class="page-header__eyebrow">Editar</span>
            <h1>Editar cronograma</h1>
        </div>
        <div class="breadcrumbs">
            <a href="{{ url_for('cronogramas.cronogramas_page') }}">← Cronograma</a>
        </div>
    </div>

    {% if error %}
    <div class="alert alert-danger" role="alert">{{ error }}</div>
    {% endif %}

    <form method="post" class="d-flex flex-column gap-3">
        <div>
            <label class="form-label" for="titulo">Título</label>
            <input type="text" id="titulo" name="titulo" class="form-control" value="{{ cronograma.titulo }}" required>
        </div>
        <div>
            <label class="form-label" for="fecha">Fecha</label>
            <input type="date" id="fecha" name="fecha" class="form-control" value="{{ cronograma.fecha }}" required>
        </div>
        <div>
            <label class="form-label" for="hora">Hora</label>
            <input type="time" id="hora" name="hora" class="form-control" value="{{ cronograma.hora }}" required>
        </div>
        <div>
            <label class="form-label" for="ubicacion_id">Lugar</label>
            <select id="ubicacion_id" name="ubicacion_id" class="form-select" required>
                <option value="">Selecciona una ubicación</option>
                {% for ubicacion in ubicaciones %}
                <option value="{{ ubicacion.id }}" {% if cronograma.ubicacion_id == ubicacion.id %}selected{% endif %}>{{ ubicacion.nombre }}</option>
                {% endfor %}
            </select>
        </div>
        <div>
            <label class="form-label" for="descripcion">Descripción</label>
            <input type="text" id="descripcion" name="descripcion" class="form-control" value="{{ cronograma.descripcion or '' }}">
        </div>
        <div>
            <label class="form-label" for="curso_ids">Cursos</label>
            <select id="curso_ids" name="curso_ids" class="form-select" multiple>
                {% set curso_ids_seleccionados = cronograma.cursos | map(attribute="id") | list %}
                {% for curso in cursos %}
                <option value="{{ curso.id }}" {% if curso.id in curso_ids_seleccionados %}selected{% endif %}>{{ curso.nombre }}</option>
                {% endfor %}
            </select>
        </div>

        <div class="d-flex gap-2 mt-2">
            <button type="submit" class="btn btn-primary">💾 Guardar cambios</button>
            <a href="{{ url_for('cronogramas.cronogramas_page') }}" class="btn btn-secondary">Cancelar</a>
        </div>
    </form>
</section>
{% endblock %}
